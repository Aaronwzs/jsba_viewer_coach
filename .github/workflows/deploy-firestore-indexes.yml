name: Deploy Firestore Indexes

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  deploy-indexes:
    name: Deploy firestore.indexes.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firestore Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Use the project id stored in secrets to target the correct Firebase project
          if [ -z "${{ secrets.FIREBASE_PROJECT }}" ]; then
            echo "FIREBASE_PROJECT secret is not set";
            exit 1;
          fi
          firebase deploy --only firestore:indexes --project "${{ secrets.FIREBASE_PROJECT }}"
