  <!-- PWA installation handling -->
  <script>
    // Track if user has dismissed install prompt
    let deferredPrompt;
    let hasDismissed = localStorage.getItem('pwa_install_dismissed') === 'true';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!hasDismissed) {
        showInstallButton();
      }
    });

    window.addEventListener('appinstalled', (e) => {
      deferredPrompt = null;
      hideInstallButton();
      localStorage.removeItem('pwa_install_dismissed');
    });

    window.triggerPwaInstall = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      }
    };

    function showInstallButton() {
      window.dispatchEvent(new CustomEvent('pwa-ready-to-show-install'));
    }

    function hideInstallButton() {
      window.dispatchEvent(new CustomEvent('pwa-hide-install'));
    }

    if (window.matchMedia('(display-mode: standalone)').matches) {
      document.body.setAttribute('data-pwa-installed', 'true');
    }
  </script>

  <!-- Interactive Logic & Event Interceptors -->
  <script>
    (function() {
      window.jsbaDebugLogs = [];
      const MAX_LOGS = 300;
      let autoExpandOnError = true;
      let isMinimized = true;
      let activeFilter = 'all';
      let searchQuery = '';

      const origLog = console.log;
      const origWarn = console.warn;
      const origError = console.error;
      const origInfo = console.info;

      function collect(type, args) {
        try {
          const message = args.map(arg => {
            try {
              if (arg === null) return 'null';
              if (arg === undefined) return 'undefined';
              if (arg instanceof Error) {
                return arg.message + '\n' + (arg.stack || '');
              }
              if (typeof arg === 'object') {
                try { return JSON.stringify(arg, null, 2); } catch (_) { return String(arg); }
              }
              return String(arg);
            } catch (err) {
              return '[Serialization Error: ' + err.message + ']';
            }
          }).join(' ');

          const logObj = {
            id: Date.now() + '-' + Math.random(),
            type: type,
            message: message,
            time: new Date().toLocaleTimeString(),
          };

          window.jsbaDebugLogs.push(logObj);
          if (window.jsbaDebugLogs.length > MAX_LOGS) {
            window.jsbaDebugLogs.shift();
          }

          renderLogs();
          updateStats();

          if (type === 'error' && autoExpandOnError && isMinimized) {
            toggleMinimize(false);
          }
        } catch (e) {
          // Safe fallback - completely ignore exceptions inside collection
        }
      }

      console.log = function(...args) {
        try { if (typeof origLog === 'function') origLog.apply(console, args); } catch (_) {}
        try { collect('log', args); } catch (_) {}
      };
      console.warn = function(...args) {
        try { if (typeof origWarn === 'function') origWarn.apply(console, args); } catch (_) {}
        try { collect('warn', args); } catch (_) {}
      };
      console.error = function(...args) {
        try { if (typeof origError === 'function') origError.apply(console, args); } catch (_) {}
        try { collect('error', args); } catch (_) {}
      };
      console.info = function(...args) {
        try { if (typeof origInfo === 'function') origInfo.apply(console, args); } catch (_) {}
        try { collect('info', args); } catch (_) {}
      };

      window.addEventListener('error', function(e) {
        try {
          const msg = e.error ? (e.error.message || e.message) : e.message;
          const stack = e.error ? (e.error.stack || '') : '';
          collect('error', [`Uncaught Exception: ${msg}`, stack]);
        } catch (_) {}
      });

      window.addEventListener('unhandledrejection', function(e) {
        try {
          const reason = e.reason;
          const msg = reason ? (reason.message || reason) : 'Unknown reason';
          const stack = (reason && reason.stack) ? reason.stack : '';
          collect('error', [`Unhandled Promise Rejection: ${msg}`, stack]);
        } catch (_) {}
      });

      window.jsbaDebug = {
        toggle: () => { try { toggleMinimize(); } catch (_) {} },
        clear: () => {
          try {
            window.jsbaDebugLogs = [];
            renderLogs();
            updateStats();
          } catch (_) {}
        },
        copy: () => {
          try {
            const text = window.jsbaDebugLogs.map(l => `[${l.time}] [${l.type.toUpperCase()}] ${l.message}`).join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => {
                showToast('Logs copied to clipboard!');
              }).catch(err => {
                fallbackCopy(text);
              });
            } else {
              fallbackCopy(text);
            }
          } catch (_) {}
        }
      };

      function fallbackCopy(text) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            showToast('Logs copied (fallback)!');
          } catch (err) {
            alert('Failed to copy. Please select text manually.');
          }
          document.body.removeChild(textarea);
        } catch (_) {}
      }

      function showToast(msg) {
        try {
          const toast = document.getElementById('db_toast');
          if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
          }
        } catch (_) {}
      }

      function toggleMinimize(forceState) {
        try {
          isMinimized = forceState !== undefined ? forceState : !isMinimized;
          const panel = document.getElementById('db_panel');
          const pill = document.getElementById('db_pill');
          if (panel && pill) {
            if (isMinimized) {
              panel.classList.remove('expanded');
              pill.classList.remove('hidden');
            } else {
              panel.classList.add('expanded');
              pill.classList.add('hidden');
              setTimeout(() => {
                const container = document.getElementById('db_logs_container');
                if (container) container.scrollTop = container.scrollHeight;
              }, 100);
            }
          }
        } catch (_) {}
      }

      function updateStats() {
        try {
          const stats = window.jsbaDebugLogs.reduce((acc, curr) => {
            if (curr.type === 'error') acc.errors++;
            else if (curr.type === 'warn') acc.warns++;
            else acc.logs++;
            return acc;
          }, { errors: 0, warns: 0, logs: 0 });

          const pillCount = document.getElementById('db_pill_count');
          const statsText = document.getElementById('db_stats_text');
          const pillIndicator = document.getElementById('db_pill_indicator');

          if (pillCount) pillCount.textContent = stats.errors > 0 ? `${stats.errors} Errors` : `${window.jsbaDebugLogs.length} Logs`;
          if (statsText) statsText.textContent = `${stats.errors} Errors | ${stats.warns} Warnings | ${stats.logs} Logs`;
          
          if (pillIndicator) {
            if (stats.errors > 0) {
              pillIndicator.className = 'status-indicator status-error';
            } else if (stats.warns > 0) {
              pillIndicator.className = 'status-indicator status-warning';
            } else {
              pillIndicator.className = 'status-indicator status-ok';
            }
          }
        } catch (_) {}
      }

      function renderLogs() {
        try {
          const container = document.getElementById('db_logs_container');
          if (!container) return;

          const filtered = window.jsbaDebugLogs.filter(log => {
            if (searchQuery && !log.message.toLowerCase().includes(searchQuery.toLowerCase())) {
              return false;
            }
            if (activeFilter === 'all') return true;
            if (activeFilter === 'errors') return log.type === 'error';
            if (activeFilter === 'warnings') return log.type === 'warn';
            if (activeFilter === 'logs') return log.type === 'log' || log.type === 'info';
            return true;
          });

          if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-logs">No logs recorded${searchQuery ? ' matching "' + searchQuery + '"' : ''}.</div>`;
            return;
          }

          container.innerHTML = filtered.map(log => {
            let typeClass = 'log-item-' + log.type;
            return `
              <div class="log-item ${typeClass}">
                <span class="log-time">[${log.time}]</span>
                <span class="log-tag">[${log.type.toUpperCase()}]</span>
                <span class="log-message">${escapeHtml(log.message)}</span>
              </div>
            `;
          }).join('');
        } catch (_) {}
      }

      function escapeHtml(text) {
        try {
          return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        } catch (_) {
          return String(text);
        }
      }

      window.jsbaDebugFilter = function(filterType, btnEl) {
        try {
          activeFilter = filterType;
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          if (btnEl) btnEl.classList.add('active');
          renderLogs();
        } catch (_) {}
      };

      window.jsbaDebugSearch = function(q) {
        try {
          searchQuery = q;
          renderLogs();
        } catch (_) {}
      };

      window.jsbaDebugToggleAutoExpand = function(checked) {
        try {
          autoExpandOnError = checked;
        } catch (_) {}
      };

      // Safely self-initialize regardless of DOM state
      function initDebugUI() {
        try {
          createUI();
          renderLogs();
          updateStats();
        } catch (_) {}
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initDebugUI);
      } else {
        initDebugUI();
      }

      function createUI() {
        try {
          if (document.getElementById('db_container')) return;

          const root = document.createElement('div');
          root.id = 'db_container';
          root.innerHTML = `
            <!-- Floating Pill Trigger -->
            <div id="db_pill" onclick="jsbaDebug.toggle()">
              <span id="db_pill_indicator" class="status-indicator status-ok"></span>
              <span class="pill-title">⚙️ Debugger</span>
              <span id="db_pill_count" class="pill-count">0 Logs</span>
            </div>

            <!-- Expanded Drawer Panel -->
            <div id="db_panel">
              <div class="db-header">
                <div class="header-left">
                  <span class="pulse-icon">⚡</span>
                  <span class="header-title">JSBA Diagnostic Engine</span>
                </div>
                <div class="header-right">
                  <span id="db_stats_text" class="header-stats">0 Errors | 0 Warnings</span>
                  <button class="action-btn" onclick="jsbaDebug.copy()">📋 Copy</button>
                  <button class="action-btn" onclick="jsbaDebug.clear()">🧹 Clear</button>
                  <button class="action-btn close-btn" onclick="jsbaDebug.toggle()">✕</button>
                </div>
              </div>

              <div class="db-controls">
                <input type="text" class="search-input" placeholder="🔍 Search/Filter Tracebacks..." oninput="jsbaDebugSearch(this.value)">
                <div class="filter-pills">
                  <button class="filter-btn active" onclick="jsbaDebugFilter('all', this)">All</button>
                  <button class="filter-btn" onclick="jsbaDebugFilter('errors', this)">Errors</button>
                  <button class="filter-btn" onclick="jsbaDebugFilter('warnings', this)">Warnings</button>
                  <button class="filter-btn" onclick="jsbaDebugFilter('logs', this)">Logs</button>
                </div>
                <label class="auto-expand-label">
                  <input type="checkbox" checked onchange="jsbaDebugToggleAutoExpand(this.checked)"> Auto-Expand
                </label>
              </div>

              <div id="db_logs_container" class="db-logs">
                <div class="empty-logs">Console listener active. Logs will appear here.</div>
              </div>
            </div>

            <!-- Sleek Toast Alert -->
            <div id="db_toast">Logs copied!</div>
          `;

          document.body.appendChild(root);
        } catch (_) {}
      }
    })();
  </script>
</head>
